
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yummy Teh!</title>

<style>
* {
  box-sizing: border-box;
}

body {
  background: linear-gradient(135deg, #fff0f0, #ffe0e5, #fff5df);
  margin: 0;
  padding-top: 85px;
  font-family: Arial, sans-serif;
  color: #593b3b;
}

header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 70px;
  background: linear-gradient(135deg, #f58b96, #ffc0c7, #f58b96);
  border-bottom: 1px solid #e77c88;
  padding: 8px 15px;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo {
  width: 48px;
  height: 48px;
  object-fit: cover;
  border-radius: 10px;
  border: 2px solid white;
}

.name {
  font-size: 21px;
  margin: 0;
  color: white;
}

.cart-count {
  background: #fff7ed;
  color: #e46e7b;
  border: 1px solid #e77c88;
  padding: 10px 15px;
  border-radius: 20px;
  font-weight: bold;
}

.container {
  padding: 15px;
  max-width: 700px;
  margin: auto;
}

.intro {
  text-align: center;
  margin-bottom: 30px;
}

.intro h2 {
  color: #dc6879;
  font-size: 28px;
}

.intro p {
  color: #86505a;
}

.menu-title {
  margin-top: 30px;
  border-bottom: 2px solid #ee9ba5;
  padding-bottom: 10px;
  color: #d66b7a;
}

.food {
  background: #fff9f5;
  border: 1px solid #f1b0b5;
  border-radius: 12px;
  margin-bottom: 15px;
  box-shadow: 0 3px 8px #e9a4aa44;
  transition: 0.2s;
}

.food:hover {
  transform: translateY(-3px);
  box-shadow: 0 5px 12px #e9a4aa66;
}

.food-info {
  padding: 18px;
}

.food-info h3 {
  color: #86505a;
  margin: 0 0 8px;
}

.price {
  color: #df7180;
  font-weight: bold;
  font-size: 18px;
}

button {
  background: #ed8995;
  color: white;
  border: none;
  padding: 12px;
  border-radius: 7px;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  background: #d96878;
}

.add {
  width: 100%;
  margin-top: 10px;
}

.cart {
  background: #fff9f5;
  border: 1px solid #f1b0b5;
  border-radius: 12px;
  padding: 18px;
  margin-top: 35px;
  box-shadow: 0 3px 8px #e9a4aa44;
}

.cart h2,
.cart h3 {
  color: #d66b7a;
}

.cart-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 15px 0;
  gap: 10px;
}

.quantity {
  display: flex;
  align-items: center;
  gap: 10px;
}

.quantity button {
  padding: 6px 11px;
}

.total {
  border-top: 1px solid #e8a4aa;
  padding-top: 15px;
  font-size: 20px;
  font-weight: bold;
  color: #d66b7a;
}

input, textarea, select {
  width: 100%;
  padding: 13px;
  margin-top: 10px;
  background: #fff;
  border: 1px solid #eea1ad;
  border-radius: 7px;
  color: #593b3b;
  font-family: Arial;
  outline: none;
}

input:focus,
textarea:focus,
select:focus {
  border-color: #df7180;
  box-shadow: 0 0 5px #ed899566;
}

textarea {
  resize: vertical;
}

label {
  display: block;
  margin-top: 15px;
  color: #86505a;
  font-weight: bold;
}

.order-btn {
  width: 100%;
  margin-top: 20px;
  padding: 15px;
  font-size: 16px;
  background: #e8798a;
}

.order-btn:hover {
  background: #ce5c70;
}

.empty {
  color: #b58a91;
  text-align: center;
}

footer {
  text-align: center;
  color: #c27d89;
  padding: 30px;
  font-size: 13px;
}

.facebook {
  display: inline-block;
  margin-top: 10px;
  color: #d66b7a;
  text-decoration: none;
  font-weight: bold;
}

.facebook:hover {
  text-decoration: underline;
}
</style>
</head>

<body>

<header>

  <div class="brand">

    <h2 class="name">Yummy Teh!</h2>

  </div>

  <div class="cart-count">
    🛒 <span id="cartCount">0</span>
  </div>

</header>

<div class="container">

  <div class="intro">
    <h2>Welcome to Yummy Teh!</h2>
    <p>Mapapa Ugh ka sa sarap.</p>
    <p>Order now!</p>

    <a class="facebook"
       href="https://www.facebook.com/share/1JKxmBvuzR/"
       target="_blank">
       Visit our Facebook page ♡
    </a>
  </div>

  <h2 class="menu-title">🍟 Snacks</h2>

  <div id="menu"></div>

  <div class="cart">

    <h2>🛒 Your Order</h2>

    <div id="cartItems">
      <p class="empty">Your Order is empty.</p>
    </div>

    <div class="total">
      Total: ₱<span id="total">0</span>
    </div>

    <h3>Customer Information</h3>

    <label>Name:</label>
    <input
      type="text"
      id="customer"
      placeholder="Enter your name"
      maxlength="30"
    >

    <label>Grade:</label>
    <select id="grade">
      <option value="">Select Grade</option>
      <option>Grade 7</option>
      <option>Grade 8</option>
      <option>Grade 9</option>
      <option>Grade 10</option>
      <option>Grade 11</option>
      <option>Grade 12</option>
      <option>College</option>
    </select>

    <label>Section:</label>
    <input
      type="text"
      id="section"
      placeholder="Enter your section"
      maxlength="15"
    >

    <label>Delivery Time:</label>
    <input
      type="text"
      id="delivery"
      placeholder="Example: 1030 or 1300"
      inputmode="numeric"
      maxlength="4"
      oninput="this.value = this.value.replace(/[^0-9]/g, '')"
    >

    <label>Notes:</label>
    <textarea
      id="notes"
      placeholder="Additional Notes"
      maxlength="50"
    ></textarea>

    <button class="order-btn" onclick="placeOrder()">
      Place Order
    </button>

  </div>

</div>

<footer>
  Yummy Teh! ♡
  <br>
  <a class="facebook"
     href="https://www.facebook.com/share/1JKxmBvuzR/"
     target="_blank">
     Facebook Page
  </a>
</footer>

<script>

const products = [
  { name: "Chao Fan Rice", price: 20 },
  { name: "Pork Lumpia", price: 5 },
  { name: "Java Rice", price: 15 },
  { name: "Chicken Poppers", price: 35 },
  { name: "Graham Bar", price: 15 },
  { name: "Chocolate Palitaw", price: 10 },
  { name: "Chocnut Turon with Caramelized Sugar", price: 20 },
  { name: "Mini Churros", price: 30 }
];

let cart = [];

function displayMenu() {

  let menu = document.getElementById("menu");

  products.forEach(product => {

    let food = document.createElement("div");
    food.className = "food";

    food.innerHTML = `
      <div class="food-info">
        <h3>${product.name}</h3>
        <p class="price">₱${product.price}.00</p>
        <button class="add">Add to Cart</button>
      </div>
    `;

    food.querySelector("button").onclick = () => {
      addToCart(product.name, product.price);
    };

    menu.appendChild(food);

  });

}

displayMenu();

function canOrder() {

  let lastOrder = localStorage.getItem("lastOrderTime");

  if (!lastOrder) return true;

  return Date.now() - Number(lastOrder) >= 120000;

}

function addToCart(name, price) {

  let item = cart.find(item => item.name === name);

  if (item) {
    item.quantity++;
  } else {
    cart.push({
      name: name,
      price: price,
      quantity: 1
    });
  }

  updateCart();

}

function changeQuantity(name, amount) {

  let item = cart.find(item => item.name === name);

  if (!item) return;

  item.quantity += amount;

  if (item.quantity <= 0) {
    cart = cart.filter(item => item.name !== name);
  }

  updateCart();

}

function updateCart() {

  let cartItems = document.getElementById("cartItems");
  let total = 0;
  let count = 0;

  cartItems.innerHTML = "";

  if (cart.length === 0) {
    cartItems.innerHTML =
      '<p class="empty">Your cart is empty.</p>';
  }

  cart.forEach(item => {

    let subtotal = item.price * item.quantity;

    total += subtotal;
    count += item.quantity;

    let div = document.createElement("div");
    div.className = "cart-item";

    let details = document.createElement("div");

    details.innerHTML =
      "<b>" + item.name + "</b><br>₱" + subtotal;

    let quantity = document.createElement("div");
    quantity.className = "quantity";

    let minus = document.createElement("button");
    minus.textContent = "-";
    minus.onclick = () => changeQuantity(item.name, -1);

    let number = document.createElement("span");
    number.textContent = item.quantity;

    let plus = document.createElement("button");
    plus.textContent = "+";
    plus.onclick = () => changeQuantity(item.name, 1);

    quantity.append(minus, number, plus);
    div.append(details, quantity);

    cartItems.appendChild(div);

  });

  document.getElementById("total").textContent = total;
  document.getElementById("cartCount").textContent = count;

}

async function placeOrder() {

  if (!canOrder()) {

    let lastOrder = Number(localStorage.getItem("lastOrderTime"));

    let remaining = Math.ceil(
      (120000 - (Date.now() - lastOrder)) / 1000
    );

    alert("Please wait " + remaining + " seconds before ordering again!");
    return;

  }

  let customer = document.getElementById("customer").value.trim();
  let grade = document.getElementById("grade").value;
  let section = document.getElementById("section").value.trim();
  let delivery = document.getElementById("delivery").value.trim();
  let notes = document.getElementById("notes").value.trim();

  if (cart.length === 0) {
    alert("Your cart is empty!");
    return;
  }

  if (!customer || !grade || !section || !delivery) {
    alert("Please complete all customer information!");
    return;
  }

  if (!/^[0-9]{4}$/.test(delivery)) {
    alert("Please enter a 4-digit delivery time, like 1030 or 1300!");
    return;
  }

  let formattedTime =
    delivery.substring(0, 2) + ":" + delivery.substring(2, 4);

  let order = cart.map(item =>
    `${item.name} x${item.quantity} = ₱${item.price * item.quantity}`
  ).join("\n");

  let total = cart.reduce((sum, item) =>
    sum + item.price * item.quantity, 0
  );

  let message = {
    content:
      "**====================**"
      "**NEW YUMMY TEH ORDER!**\n\n" +
      "**@everyone**\n\n" +
      "**Name:** " + customer + "\n" +
      "**Grade:** " + grade + "\n" +
      "**Section:** " + section + "\n" +
      "**Delivery Time:** " + formattedTime + "\n\n" +
      "**ORDER:**\n" + order + "\n\n" +
      "**Total:** ₱" + total + "\n" +
      "**Notes:** " + (notes || "None")
      "**====================**"
  };

  const webhook = "https://discord.com/api/webhooks/1565128279617445990/Y5W71Gu-nV1qugBhhiO_rLWP22oWI8gIMEB0iDt_KRPPnEH5dQgTA_jKmbb2qTnTSkwh";

  try {

    let response = await fetch(webhook, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(message)
    });

    if (!response.ok) {
      throw new Error("Failed");
    }

    alert("Your order has been sent!");

    localStorage.setItem("lastOrderTime", Date.now());

    cart = [];
    updateCart();

    document.getElementById("customer").value = "";
    document.getElementById("grade").value = "";
    document.getElementById("section").value = "";
    document.getElementById("delivery").value = "";
    document.getElementById("notes").value = "";

  } catch (error) {

    alert("Something went wrong. Please try again.");

  }

}

</script>

</body>
</html>
